# Exemple de déploiement complet : application + MySQL + Redis + nginx + tâches planifiées.
# Depuis backend/deploy :  docker compose --env-file ../.env up -d --build
# Prérequis : frontend construit (cd frontend && npm run build), certificats dans ./certs,
# nginx.conf adapté (upstream « server app:8010; »).
# ../.env doit contenir au minimum SECRET_KEY, JWT_SIGNING_KEY, FIELD_ENCRYPTION_KEY, ALLOWED_HOSTS,
# CSRF_TRUSTED_ORIGINS, MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD (voir docs/DEPLOIEMENT.md).

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: agapy-gallery-backend
  env_file: ../.env
  environment:
    DEBUG: "False"
    DATABASE_URL: mysql://agapy_gallery:${MYSQL_PASSWORD}@db:3306/agapy_gallery
    CACHE_URL: rediscache://redis:6379/1
    NUM_PROXIES: "1"
    TZ: Africa/Abidjan
  volumes:
    - media:/app/media
    - static:/app/staticfiles
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  app:
    <<: *app
    # Migrations et fichiers statiques au démarrage, puis Gunicorn.
    # GUNICORN_FORWARDED_ALLOW_IPS="*" : seul nginx (réseau interne) peut joindre ce conteneur.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application -c deploy/gunicorn.conf.py --bind 0.0.0.0:8010"
    environment:
      DEBUG: "False"
      DATABASE_URL: mysql://agapy_gallery:${MYSQL_PASSWORD}@db:3306/agapy_gallery
      CACHE_URL: rediscache://redis:6379/1
      NUM_PROXIES: "1"
      TZ: Africa/Abidjan
      GUNICORN_FORWARDED_ALLOW_IPS: "*"
    expose: ["8010"]

  scheduler:
    <<: *app
    command: ["sh", "deploy/scheduler.sh"]
    healthcheck: { disable: true }
    depends_on:
      app: { condition: service_healthy }

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agapy_gallery
      MYSQL_USER: agapy_gallery
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD manquant}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD manquant}
      TZ: Africa/Abidjan
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Cache uniquement : pas de persistance sur disque
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./agapy_proxy_params:/etc/nginx/agapy_proxy_params:ro
      - ../../frontend/dist:/srv/agapy-gallery/frontend/dist:ro
      - static:/srv/agapy-gallery/backend/staticfiles:ro
      - media:/srv/agapy-gallery/backend/media:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mysql:
  media:
  static:
