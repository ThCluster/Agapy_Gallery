# nginx pour AGAPY-GALLERY : frontend construit (frontend/dist) + API et administration Django.
# À adapter : agapy-gallery.com, chemins des certificats, « gestion-xxxx » (= ADMIN_URL).
# docker-compose : remplacer « server 127.0.0.1:8010 » par « server app:8010 ».

upstream agapy_django {
    server 127.0.0.1:8010;
    keepalive 16;
}

# Limite grossière en amont de celles de Django (par adresse IP)
limit_req_zone $binary_remote_addr zone=agapy_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name agapy-gallery.com www.agapy-gallery.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://agapy-gallery.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.agapy-gallery.com;
    ssl_certificate     /etc/letsencrypt/live/agapy-gallery.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agapy-gallery.com/privkey.pem;
    return 301 https://agapy-gallery.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agapy-gallery.com;

    ssl_certificate     /etc/letsencrypt/live/agapy-gallery.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agapy-gallery.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    charset utf-8;

    # Vidéos des clips (50 Mo), extraits (20 Mo), images d'œuvres (10 Mo)
    client_max_body_size 60m;
    client_body_timeout 120s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-têtes de sécurité communs. Attention : nginx ne les hérite PAS dans un bloc location qui
    # déclare ses propres add_header ; ils y sont donc répétés.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    access_log /var/log/nginx/agapy.access.log;
    error_log  /var/log/nginx/agapy.error.log warn;

    # ------------------------------------------------------------------ Django
    location /api/ {
        limit_req zone=agapy_api burst=40 nodelay;
        proxy_pass http://agapy_django;
        include /etc/nginx/agapy_proxy_params;
    }

    # Administration (chemin = ADMIN_URL). Possible : allow <IP du bureau>; deny all;
    location /gestion-xxxx/ {
        proxy_pass http://agapy_django;
        include /etc/nginx/agapy_proxy_params;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://agapy_django;
        include /etc/nginx/agapy_proxy_params;
    }

    # Fichiers statiques de Django (administration, Swagger) : manage.py collectstatic
    location /static/ {
        alias /srv/agapy-gallery/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Pleines résolutions des œuvres : jamais servies directement. Django les délivre après
    # contrôle d'accès en répondant « X-Accel-Redirect: /media/artworks/... ».
    location /media/artworks/ {
        internal;
        alias /srv/agapy-gallery/backend/media/artworks/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Autres fichiers téléversés (photos de profil, vignettes, affiches, clips)
    location /media/ {
        alias /srv/agapy-gallery/backend/media/;
        expires 7d;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            audio/mpeg mp3;
            audio/mp4 m4a;
            audio/aac aac;
            audio/ogg ogg;
            audio/wav wav;
        }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Un fichier téléversé ne doit jamais s'exécuter comme une page ou un script
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
    }

    # ------------------------------------------------------------------ Frontend (npm run build)
    root /srv/agapy-gallery/frontend/dist;

    # Fichiers dont le nom contient une empreinte : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;   # routes de l'application React
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # CSP du frontend construit : polices Google, TV en ligne (YouTube, Vimeo, Facebook, Dailymotion)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.facebook.com https://www.dailymotion.com https://geo.dailymotion.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    }
}
